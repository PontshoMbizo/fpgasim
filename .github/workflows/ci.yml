name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 18.x dropped: source uses import-attributes syntax
        # (`with { type: 'json' }` in src/boards/tangnano9k.js) and relies on
        # Node's ESM-auto-detection for extensionless .js files (no
        # "type": "module" in package.json) — both need Node 20+. Matches
        # stmVSimulator's ci.yml matrix.
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit

    - name: Build Library
      run: npm run build:lib
