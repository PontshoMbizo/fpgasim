name: Build sandbox image

# Builds the hardened Verilog-sim sandbox image (Dockerfile.sim) and publishes it
# to GHCR. The deployed app launches this image per simulation (see sandbox.js).
on:
  push:
    branches: [ "main" ]
    paths:
      - "sim/**"
      - "Dockerfile.sim"
      - ".github/workflows/sim-image.yml"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nika-sim
        uses: docker/build-push-action@v6
        with:
          context: sim
          file: Dockerfile.sim
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/nika-sim:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/nika-sim:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
