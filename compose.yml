# Self-host bundle for nikaVSimulator.
#
# Prereq (run once on the host): build the hardened sim image so the app can spawn it
#   docker build -t nika-sim -f Dockerfile.sim sim/
#
# The app talks to the host's Docker daemon via the mounted socket and launches one
# fully locked-down, network-less sandbox container per simulation (src/lib/sandbox.js).
# Because each sandbox runs with `--network none`, there is no sim service to network —
# the only published surface is the app on :3000.
#
# Trust note: the mounted socket grants ROOT-EQUIVALENT control of the host — this is
# a standard Docker socket caveat, not specific to this app. See docs/simulation-backend.md
# → Threat model for mitigations (rootless Docker, a socket proxy, etc).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      SIM_RUNTIME: docker
      SIM_IMAGE: nika-sim:latest
      # Tunables (see src/lib/sandbox.js):
      SIM_TIMEOUT_S: "12"
      SIM_MEMORY: "256m"
      SIM_CPUS: "1"
      SIM_MAX_VCD_BYTES: "16777216"
      SIM_MAX_CONCURRENT: "4"
      SIM_RATE_PER_MIN: "30"
    volumes:
      # Docker socket from the host. Make sure the daemon is running:
      #   systemctl enable --now docker
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    mem_limit: 1g
