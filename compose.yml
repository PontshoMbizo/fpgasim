# Self-host bundle for nikaVSimulator.
#
# Prereq (run once on the host): build the hardened sim image so the app can spawn it
#   podman build -t nika-sim -f Dockerfile.sim sim/
#
# HARDENED (VM-local change, 2026-07-01): the app no longer mounts the raw Docker
# socket (which grants ROOT-EQUIVALENT host control per the threat model in
# docs/simulation-backend.md). It instead talks to the host's ROOTLESS Podman socket
# (uid 1000/ubuntu, systemd --user podman.socket), which cannot escalate to host root
# even if the app process is fully compromised. Each sandbox run still launches with
# --network none, --cap-drop ALL, no-new-privileges, resource caps (src/lib/sandbox.js);
# this change only narrows the blast radius of the control-plane socket itself.
#
# If upstream changes replace this file, re-apply: SIM_RUNTIME=podman,
# SIM_IMAGE=localhost/nika-sim:latest, SIM_PODMAN_URL env, and the podman.sock volume
# mount (see Dockerfile's matching podman-instead-of-docker-cli change, and
# src/lib/sandbox.js's SIM_PODMAN_URL --remote/--url support).
#
# Version note: the host's rootless Podman (Kubic apt repo, Ubuntu 20.04) is pinned at
# 3.4.2 — quite old. podman-remote clients newer than ~4.x refuse to talk to a server
# that old ("API version too old"), so the Dockerfile pins the CLI to 3.4.7 (from
# Alpine v3.15's repo) to match. If the host's podman is ever upgraded, this pin can
# be dropped in favor of whatever's current in the base image's Alpine repo.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      SIM_RUNTIME: podman
      SIM_IMAGE: localhost/nika-sim:latest
      SIM_PODMAN_URL: unix:///var/run/podman/podman.sock
      FRAME_ANCESTORS: "http://localhost:3000"
      # Tunables (see src/lib/sandbox.js):
      SIM_TIMEOUT_S: "12"
      SIM_MEMORY: "256m"
      SIM_CPUS: "1"
      SIM_MAX_VCD_BYTES: "16777216"
      SIM_MAX_CONCURRENT: "4"
      SIM_RATE_PER_MIN: "30"
    volumes:
      # Rootless Podman socket from the host (ubuntu user, uid 1001), NOT the Docker
      # socket. systemctl --user status podman.socket to confirm it's active.
      - /run/user/1001/podman/podman.sock:/var/run/podman/podman.sock
    restart: unless-stopped
    mem_limit: 1g
